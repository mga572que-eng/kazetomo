<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<meta name="description" content="風と灯りの島で、ちいさな相棒たちと旅するRPG">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ともしびアイランド">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ともしびアイランド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=DotGothic16&family=Mochiy+Pop+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#0b1016; --ink:#f4f0e6; --muted:#b9b3a3; --win:rgba(12,18,40,.9); --win-line:#f4f0e6; --gold:#f3c15a;
    --flame:#f3a54a; --flame-deep:#c2572b; --hp:#6fd08a; --mp:#6fb2f0; --danger:#e45b5b; --chip:rgba(12,18,30,.72); --line:rgba(244,240,230,.22);
    --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
    --pixel:"DotGothic16","Zen Kaku Gothic New","Hiragino Sans",monospace;
    --ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  }
  [hidden]{display:none!important}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .fallback{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
  kbd{font-family:var(--ui);font-size:.8em;border:1px solid var(--line);border-radius:4px;padding:0 5px}

  /* ---------- windows (classic RPG) ---------- */
  .win{background:var(--win);border:2px solid var(--win-line);border-radius:8px;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.45);font-family:var(--pixel);color:var(--ink)}
  .menu{position:fixed;min-width:180px;max-height:78vh;overflow:auto;padding:8px 6px;z-index:40}
  .m-center{left:50%;top:50%;transform:translate(-50%,-50%)}
  .m-side{left:calc(16px + env(safe-area-inset-left,0px));top:calc(56px + env(safe-area-inset-top,0px));max-width:min(420px,70vw)}
  .m-yn{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .m-battle{position:absolute;left:0;bottom:0;width:100%;max-height:100%;min-width:0;padding:6px 4px}
  .m-battle .m-list{grid-template-columns:1fr 1fr}
  .m-battle .m-item{padding:6px 6px 6px 2px;font-size:15px}
  .m-battle .m-x.solo{top:-30px;right:0;background:var(--win);border:2px solid var(--win-line);border-radius:6px}
  body.modal #hud .btns,body.modal #hud .buildbar,body.modal #hud .keys-hint{display:none}
  body.inbattle #hud,body.inbattle #tlabel{display:none}
  body.modal #btnMute{display:none}
  .m-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--gold);padding:2px 8px 6px;border-bottom:1px dashed rgba(244,240,230,.3);margin-bottom:4px}
  .m-x{background:none;border:0;cursor:pointer;font-size:14px;opacity:.8;padding:2px 6px}
  .m-x.solo{position:absolute;right:6px;top:4px}
  .m-list{display:grid}
  .m-item{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:6px;text-align:left;background:none;border:0;padding:7px 10px 7px 4px;font-size:16px;cursor:pointer;border-radius:4px;white-space:nowrap}
  .m-item .m-cur{visibility:hidden;color:var(--ink);font-size:12px}
  .m-item.on .m-cur{visibility:visible;animation:blink .8s steps(2) infinite}
  .m-item.on{background:rgba(255,255,255,.07)}
  .m-item.dis{opacity:.4}
  .m-s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .m-item:focus-visible{outline:2px solid var(--gold)}
  @keyframes blink{50%{opacity:0}}
  .panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;padding:16px 20px;z-index:45;font-size:15px;line-height:1.7}
  .panel.wide{width:min(860px,calc(100vw - 32px))}
  .panel h3{margin:0 0 8px;font-weight:400;color:var(--gold);font-size:18px}
  .panel p{margin:.3em 0}
  .st-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
  .st-card{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start;border:1px solid rgba(244,240,230,.2);border-radius:6px;padding:8px}
  .st-face{width:72px;height:72px;border-radius:6px;background:#1c2744;overflow:hidden}
  .st-card table{font-size:13px;border-collapse:collapse;margin-top:4px;font-variant-numeric:tabular-nums}
  .st-card td{padding:0 8px 0 0}.st-card td:nth-child(odd){color:var(--muted)}
  .st-sk{font-size:12px;color:var(--gold);margin-top:4px}.st-eq{font-size:13px;color:var(--muted);margin-top:10px}
  .fr{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}.fr-art{background:#1c2744;border-radius:8px}
  .cb{display:grid;grid-template-columns:minmax(150px,30%) 1fr;gap:18px}
  .cb-face{background:radial-gradient(circle at 50% 40%,#2c3a64,#141b33);border-radius:8px;align-self:start}
  .cb-role{color:var(--gold);font-size:13px}.cb h3{color:var(--ink);font-size:24px}.cb h3 small{font-size:13px;color:var(--muted)}
  .cb dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-size:14px}.cb dt{color:var(--muted)}.cb dd{margin:0}
  .cb-line{font-size:15px;border-top:1px dashed rgba(244,240,230,.3);padding-top:8px;color:#ffe9b8}
  .howto{padding-left:1.2em;margin:0;display:grid;gap:4px}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;padding:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
  .hud-tl{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:grid;gap:6px;max-width:42vw}
  #obj{font-family:var(--pixel);font-size:14px;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:5px 10px;}
  #obj::before{content:'▶ ';color:var(--gold)}
  #pmini{display:grid;gap:3px;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:5px 9px;width:max-content}
  .pm{display:grid;grid-template-columns:5.5em 70px 2.5em;gap:6px;align-items:center;font-family:var(--pixel);font-size:12px}
  .pm-v{text-align:right;font-variant-numeric:tabular-nums}
  .pm{grid-template-columns:7.5em 70px 2.5em}.pm-n small{color:var(--muted);font-size:10px}.pm .bar{position:relative;height:7px}.pm .bar em{position:absolute;left:0;bottom:0;height:2px;background:#f3c15a}
  .bar{display:block;height:6px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
  .bar i{display:block;height:100%;background:var(--hp);transition:width .3s}
  .bar.mp i{background:var(--mp)}
  .hud-tr{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;pointer-events:auto}
  #inv{display:flex;gap:10px;font-family:var(--pixel);font-size:13px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;pointer-events:none}
  #inv b{color:var(--gold);font-weight:400}
  .chip-btn{pointer-events:auto;font:700 13px var(--ui);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;}
  #btnMute{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;pointer-events:auto;font-size:11px;opacity:.75}
  body.infield #btnMute{bottom:auto;top:calc(52px + env(safe-area-inset-top,0px))}
  #guide{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 6px;font-family:var(--pixel);font-size:13px}
  #arrow{width:22px;height:22px;display:grid;place-items:center}
  #toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(16px,2.6vw,24px);letter-spacing:.1em;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.7);opacity:0;transition:opacity .6s;pointer-events:none;z-index:30;max-width:80vw;line-height:1.6}
  #toast.on{opacity:1}
  #tlabel{position:fixed;left:0;top:0;font-family:var(--pixel);font-size:13px;background:rgba(12,18,40,.82);border:1px solid rgba(244,240,230,.6);border-radius:6px;padding:3px 9px;white-space:nowrap;pointer-events:none;z-index:20}
  .float{position:fixed;transform:translate(-50%,-50%);font-family:var(--pixel);font-size:16px;color:var(--gold);text-shadow:0 1px 4px #000;pointer-events:none;animation:rise 1.4s ease-out forwards;z-index:25}
  @keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
  .btns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end;justify-items:end;pointer-events:none}
  .rb{pointer-events:auto;border-radius:50%;background:var(--chip);border:1.5px solid var(--line);cursor:pointer;display:grid;place-items:center;font:700 13px var(--ui);touch-action:none}
  #btnAct{width:86px;height:86px;grid-row:1/3;grid-column:2;font-size:12px;line-height:1.25;padding:6px;text-align:center}
  #btnAct.ready{background:linear-gradient(180deg,var(--flame),var(--flame-deep));color:#2a1406;border:0;box-shadow:0 0 22px rgba(243,165,74,.5)}
  #btnJump{width:60px;height:60px}
  .buildbar{position:absolute;right:calc(130px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;pointer-events:none}
  .buildbar .rb{width:52px;height:52px}
  #btnPlace,#btnBreak,#btnMat{display:none}
  body.building #btnPlace,body.building #btnBreak,body.building #btnMat{display:grid}
  body.building #btnBuild{background:var(--gold);color:#241a08}
  .keys-hint{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--muted);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 10px;line-height:1.7}
  @media (pointer:coarse){.keys-hint{display:none}}
  @media (pointer:fine){#btnJump{display:none}}
  .stick{position:fixed;width:112px;height:112px;border-radius:50%;border:1.5px solid var(--line);background:rgba(18,22,28,.28);transform:translate(-50%,-50%);pointer-events:none;z-index:15}
  .stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:rgba(243,239,228,.55);transform:translate(-50%,-50%)}

  /* ---------- dialogue ---------- */
  #dlg{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(860px,calc(100vw - 32px));min-height:clamp(96px,26vh,150px);display:grid;grid-template-columns:auto 1fr;gap:14px;padding:12px 16px;z-index:35;cursor:pointer}
  #dlg.narr{grid-template-columns:1fr}
  #dlgFace{width:clamp(80px,22vh,124px);height:clamp(80px,22vh,124px);border-radius:6px;background:radial-gradient(circle at 50% 40%,#2c3a64,#141b33);overflow:hidden;align-self:center;border:1px solid rgba(244,240,230,.35)}
  #dlgName{font-size:15px;color:var(--gold);margin-bottom:2px}
  #dlgText{font-size:clamp(15px,2.3vw,19px);line-height:1.65;white-space:pre-wrap;min-height:3.3em}
  #dlgMore{position:absolute;right:14px;bottom:8px;animation:blink .8s steps(2) infinite;font-size:12px}

  /* ---------- battle ---------- */
  #battle{position:fixed;inset:0;z-index:30;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));
    background:radial-gradient(ellipse at 50% 55%,rgba(40,34,70,.55),rgba(8,10,20,.92) 70%)}
  #battle.isboss{background:radial-gradient(ellipse at 50% 50%,rgba(70,30,90,.6),rgba(6,4,12,.95) 70%)}
  #battle.quake{animation:quake .3s}
  @keyframes quake{25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,2px)}}
  #bParty{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap}
  .pc{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;background:var(--win);border:2px solid var(--win-line);border-radius:8px;padding:5px 10px 5px 5px;min-width:0;width:clamp(150px,22vw,220px);font-family:var(--pixel);position:relative;transition:transform .2s}
  .pc.act{border-color:var(--gold);transform:translateY(4px);box-shadow:0 0 16px rgba(243,193,90,.5)}
  .pc.down{opacity:.5;filter:grayscale(.8)}
  .pc-face{width:clamp(40px,11vh,56px);height:clamp(40px,11vh,56px);border-radius:5px;background:#1c2744;overflow:hidden}
  .pc-info{display:grid;gap:2px;min-width:0}
  .pc-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc-name small{color:var(--muted);margin-left:6px;font-size:11px}
  .pc-num{font-size:11px;color:#ddd;font-variant-numeric:tabular-nums}
  #bFoes{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,3vw,40px);min-height:0}
  .foe{display:grid;justify-items:center;gap:4px;position:relative;transition:opacity .6s, filter .6s}
  .foe-art{width:clamp(110px,30vh,190px);height:clamp(110px,30vh,190px);animation:bob 2.4s ease-in-out infinite}
  .foe.boss .foe-art{width:clamp(170px,46vh,320px);height:clamp(170px,46vh,320px)}
  .foe-name{font-family:var(--pixel);font-size:14px;background:rgba(0,0,0,.45);padding:1px 8px;border-radius:4px}
  .foe .bar{width:clamp(140px,30vh,260px)}.foe .bar i{background:var(--danger)}
  .foe.gone{opacity:0;filter:brightness(3) blur(6px)}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .shake{animation:shake .35s}
  @keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .dmg{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--pixel);font-size:26px;color:#fff;text-shadow:0 0 4px #000,0 2px 0 #000;animation:dmg .9s ease-out forwards;pointer-events:none;z-index:2}
  .dmg.heal{color:var(--hp)}
  @keyframes dmg{0%{transform:translate(-50%,0) scale(1.4)}100%{transform:translate(-50%,-40px);opacity:0}}
  #bBottom{display:grid;grid-template-columns:clamp(170px,24vw,240px) 1fr;gap:10px;height:clamp(110px,31vh,190px)}
  #bCmd{position:relative}
  #bMsg{padding:10px 16px;font-family:var(--pixel);font-size:clamp(14px,2.2vw,18px);line-height:1.7;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
  .bflash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:31}
  .bflash.go{animation:flash .45s}
  .bflash.white{background:#fff}.bflash.fire{background:radial-gradient(circle,#ffb347,#ff5a1f)}.bflash.light{background:radial-gradient(circle,#fff6c9,#f3c15a)}.bflash.heal{background:radial-gradient(circle,#c9ffd9,#6fd08a)}
  .bflash.song{background:radial-gradient(circle,#ffd6f0,#b98cff)}.bflash.slash{background:linear-gradient(120deg,transparent 40%,#fff 50%,transparent 60%)}.bflash.rock{background:#8a7a60}.bflash.water{background:radial-gradient(circle,#c9f5ff,#4fb0e0)}.bflash.dark{background:radial-gradient(circle,#6b3fb0,#12081f)}
  @keyframes flash{0%{opacity:.75}100%{opacity:0}}
  #swipe{position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(90deg,#000 0 8%,transparent 8% 16%);transform:scaleX(0);transform-origin:left}
  #swipe.go{animation:swipe .65s steps(8) forwards}
  @keyframes swipe{to{transform:scaleX(1);background:#000}}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .9s;z-index:55}
  #fade.on{opacity:1}

  /* ---------- title / cut / credits ---------- */
  .screen{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding-inline:16px;text-align:center}
  #splash{background:radial-gradient(ellipse at 50% 60%,rgba(11,16,22,.2),rgba(11,16,22,.85));cursor:pointer}
  #splash p{font-family:var(--pixel);font-size:16px;letter-spacing:.2em;animation:blink 1.4s steps(2) infinite}
  #title{background:linear-gradient(180deg,rgba(8,12,22,.1),rgba(8,12,22,.7))}
  .logo{font-family:"Mochiy Pop One",var(--ui);font-weight:400;font-size:clamp(40px,12vh,100px);letter-spacing:.05em;margin:0;line-height:1.05;display:grid;justify-items:center;gap:.12em}
  .logo .lw{display:inline-flex}.logo .lw i{font-style:normal;display:inline-block;background:linear-gradient(180deg,#fff7c9 0%,#ffd45c 45%,#ff9f43 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.045em #5a2f12;paint-order:stroke fill;filter:drop-shadow(0 .06em 0 #5a2f12) drop-shadow(0 .12em .18em rgba(0,0,0,.45));animation:hop 2.8s ease-in-out infinite}
  .logo .lw i:nth-child(2){animation-delay:.12s}.logo .lw i:nth-child(3){animation-delay:.24s}.logo .lw i:nth-child(4){animation-delay:.36s}.logo .lw i:nth-child(5){animation-delay:.48s;color:transparent}
  .logo .lw2{font-size:.66em;margin-top:-.18em}.logo .lw2 i{background:linear-gradient(180deg,#e9fbff 0%,#8fdcff 50%,#3f9be6 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke-color:#123a66;filter:drop-shadow(0 .06em 0 #123a66) drop-shadow(0 .12em .18em rgba(0,0,0,.45))}
  @keyframes hop{0%,70%,100%{transform:translateY(0) rotate(0)}78%{transform:translateY(-.14em) rotate(-4deg)}86%{transform:translateY(0) rotate(2deg)}}
  .logo small{font-family:"Mochiy Pop One",var(--ui);font-size:clamp(12px,3vh,20px);letter-spacing:.14em;color:#bfe8ff;text-shadow:0 2px 0 #1b3550,0 0 14px rgba(120,200,255,.5)}
  .logo-sub{font-family:var(--display);font-size:clamp(11px,2.6vh,17px);letter-spacing:.18em;color:var(--gold);margin:12px 0 22px}
  .t-btns{display:grid;gap:10px;justify-items:center}
  .t-btn{font-family:var(--pixel);font-size:18px;letter-spacing:.2em;padding:10px 36px;min-width:220px;background:var(--win);border:2px solid var(--win-line);border-radius:8px;cursor:pointer}
  .t-btn:hover,.t-btn:focus-visible{border-color:var(--gold);color:var(--gold);outline:none}
  #nameForm{display:grid;gap:12px;justify-items:center;font-family:var(--pixel);padding:18px 24px}
  #nameIn{font-family:var(--pixel);font-size:22px;text-align:center;width:9em;background:#0c1228;color:var(--ink);border:2px solid var(--win-line);border-radius:6px;padding:6px;-webkit-user-select:text;user-select:text}
  #cut{background:#000;z-index:65}
  #cut p{font-family:var(--display);font-size:clamp(18px,4vh,28px);letter-spacing:.14em;line-height:1.9;animation:fadein 1.4s}
  @keyframes fadein{from{opacity:0}}
  #credits{background:#05070c;z-index:75;overflow:hidden;display:block}
  .cr-roll{position:absolute;left:50%;top:100%;transform:translateX(-50%);width:min(520px,90vw);text-align:center;animation:roll 58s linear forwards;font-family:var(--display);line-height:1.8}
  @keyframes roll{to{top:-260%}}
  .cr-roll h2{font-size:44px;letter-spacing:.2em;margin:0}.cr-sub{color:var(--gold);letter-spacing:.3em;margin-bottom:60px}
