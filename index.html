<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<meta name="description" content="風と灯りの島で、ちいさな相棒たちと旅するRPG">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ともしびアイランド">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ともしびアイランド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Webフォントは 描画を 止めない（オフラインでは 端末フォントで そのまま 遊べる） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=DotGothic16&family=Mochiy+Pop+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=DotGothic16&family=Mochiy+Pop+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap"></noscript>
<style>
  :root{
    color-scheme: dark;
    --bg:#0b1016; --ink:#f4f0e6; --muted:#b9b3a3; --win:rgba(12,18,40,.9); --win-line:#f4f0e6; --gold:#f3c15a;
    --flame:#f3a54a; --flame-deep:#c2572b; --hp:#6fd08a; --mp:#6fb2f0; --danger:#e45b5b; --chip:rgba(12,18,30,.72); --line:rgba(244,240,230,.22);
    --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
    --pixel:"DotGothic16","Zen Kaku Gothic New","Hiragino Sans",monospace;
    --ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    /* UI system：余白・角丸・線・面（全パネル共通） */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
    --r1:6px; --r2:10px; --r3:14px;
    --gold-line:rgba(243,193,90,.5); --gold-soft:rgba(243,193,90,.12); --card:rgba(255,255,255,.045); --card-line:rgba(244,240,230,.16);
    --panel-bg:linear-gradient(180deg,rgba(20,28,58,.985),rgba(10,15,34,.985));
    --scrim:rgba(4,7,14,.66);
    --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
    --bb-h:clamp(110px,31vh,190px); /* バトル下段（コマンド＋メッセージ）の高さ */
  }
  @media (max-height:430px){:root{--bb-h:30vh}}
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .fallback{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
  kbd{font-family:var(--ui);font-size:.8em;border:1px solid var(--line);border-radius:4px;padding:0 5px}

  /* ---------- windows (classic RPG) ---------- */
  .win{background:var(--win);border:2px solid var(--win-line);border-radius:var(--r2);box-shadow:inset 0 0 0 1px rgba(243,193,90,.14),0 0 0 2px rgba(0,0,0,.6),0 12px 32px rgba(0,0,0,.5);font-family:var(--pixel);color:var(--ink)}
  .menu{position:fixed;min-width:180px;max-height:calc(var(--app-h,100vh) * .78);overflow:auto;overscroll-behavior:contain;padding:var(--s2) 6px;z-index:40}
  .menu:not(.m-battle){background:var(--panel-bg)}
  .m-center{left:50%;top:50%;transform:translate(-50%,-50%);max-height:calc(var(--app-h,100vh) - 24px - var(--st) - var(--sb))}
  .m-side{left:calc(16px + var(--sl));top:calc(56px + var(--st));max-width:min(420px,70vw);max-height:calc(var(--app-h,100vh) - 68px - var(--st) - var(--sb))}
  .m-yn{right:calc(20px + var(--sr));bottom:calc(150px + var(--sb))}
  /* メインメニュー：タイル（3列×3段・スクロールなし） */
  .m-grid{left:50%;top:50%;transform:translate(-50%,-50%);width:min(660px,calc(var(--app-w,100vw) - 32px - var(--sl) - var(--sr)));max-height:calc(var(--app-h,100vh) - 16px - var(--st) - var(--sb));padding:var(--s2) var(--s3) var(--s3)}
  .m-grid .m-title{font-size:15px;padding:0 0 6px 4px;margin-bottom:var(--s2)}
  .m-grid .m-title small{color:var(--muted);font-size:12px;margin-left:10px}
  .m-grid .m-list{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:clamp(56px,calc((var(--app-h,100vh) - 136px) / 3),92px);gap:var(--s2)}
  .m-grid.c2 .m-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m-grid .m-item{grid-template-columns:44px minmax(0,1fr);grid-template-rows:auto auto;align-content:center;column-gap:10px;row-gap:3px;padding:6px 12px 6px 10px;background:var(--card);border:1px solid var(--card-line);border-radius:var(--r2);white-space:normal;transition:background .15s,border-color .15s}
  .m-grid .m-item .m-cur{display:none}
  .m-grid .m-item .m-l{display:contents}
  .m-grid .m-item .ti{grid-column:1;grid-row:1/3;align-self:center;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:22px;background:radial-gradient(circle at 50% 35%,rgba(243,193,90,.26),rgba(243,193,90,.06));border:1px solid var(--gold-line)}
  .m-grid .m-item b{grid-column:2;grid-row:1;align-self:end;font-weight:400;font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-grid .m-item .m-s{grid-column:2;grid-row:2;align-self:start;font-size:12px;line-height:1.3;white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:auto-phrase}
  .m-grid .m-item.on{background:var(--gold-soft);border-color:var(--gold)}
  .m-grid .m-item:active{transform:translateY(1px)}
  .m-grid .m-item .ti{position:relative}
  .m-grid .m-item.badge .ti::after{content:'';position:absolute;right:0;top:0;width:10px;height:10px;border-radius:50%;background:#ff7a5a;box-shadow:0 0 6px #ff7a5a}
  /* モーダルの 背景（パネル・メニューの うしろを 暗く） */
  #ui:has(> .panel, > .menu.m-side, > .menu.m-center, > .menu.m-grid)::before{content:'';position:fixed;inset:0;background:var(--scrim);z-index:39;animation:scrimIn .18s ease-out}
  @keyframes scrimIn{from{opacity:0}}
  body:has(#ui > .panel) #toast{z-index:90;background:var(--panel-bg);border:2px solid var(--gold-line);border-radius:var(--r2);padding:10px 18px}
  .m-battle{position:absolute;left:0;bottom:0;width:100%;max-height:100%;min-width:0;padding:6px 4px}
  .m-battle .m-list{grid-template-columns:1fr 1fr}
  .m-battle .m-item{padding:6px 6px 6px 2px;font-size:15px}
  .m-battle .m-x.solo{position:absolute;float:none;margin:0;width:auto;height:auto;font-size:14px;top:-30px;right:0;background:var(--win);border:2px solid var(--win-line);border-radius:6px}
  body.modal #hud .btns,body.modal #hud .buildbar,body.modal #hud .keys-hint{display:none}
  body.inbattle #hud,body.inbattle #tlabel{display:none}
  .m-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--gold);padding:2px 8px 6px;border-bottom:1px dashed rgba(244,240,230,.3);margin-bottom:4px}
  .m-x{background:none;border:0;cursor:pointer;font-size:14px;opacity:.8;padding:2px 6px}
  .menu:not(.m-battle) .m-title .m-x{flex:none;width:44px;height:44px;margin:-10px -4px -8px 0;font-size:18px;opacity:.9;display:grid;place-items:center;border-radius:50%}
  .m-x.solo{position:sticky;float:right;top:0;margin:-6px -8px 0 8px;z-index:3;width:44px;height:44px;border-radius:50%;background:rgba(12,18,40,.95);border:1.5px solid rgba(244,240,230,.5);font-size:20px;opacity:1;display:grid;place-items:center;padding:0}
  .m-list{display:grid}
  .m-item{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:6px;text-align:left;background:none;border:0;padding:7px 10px 7px 4px;font-size:16px;cursor:pointer;border-radius:var(--r1);white-space:nowrap}
  .menu:not(.m-battle) .m-item{min-height:44px}
  .m-item .m-cur{visibility:hidden;color:var(--ink);font-size:12px}
  .m-item.on .m-cur{visibility:visible;animation:blink .8s steps(2) infinite}
  .m-item.on{background:rgba(255,255,255,.07)}
  .m-item.dis{opacity:.4}
  .m-s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .m-item:focus-visible{outline:2px solid var(--gold)}
  @keyframes blink{50%{opacity:0}}
  .panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(var(--app-w,100vw) - 32px - var(--sl) - var(--sr)));max-height:calc(var(--app-h,100vh) - 24px - var(--st) - var(--sb));overflow:auto;overscroll-behavior:contain;padding:var(--s4) 20px;z-index:45;font-size:15px;line-height:1.7;background:var(--panel-bg)}
  .panel.wide{width:min(860px,calc(var(--app-w,100vw) - 32px - var(--sl) - var(--sr)))}
  .panel h3{margin:0 0 8px;font-weight:400;color:var(--gold);font-size:18px}
  .panel p{margin:.3em 0}
  .panel h3 small{font-size:13px;color:var(--muted)}
  /* つよさ：カード（≤900pxは 2枚／行）・ステータスは 2列グリッド */
  .st-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s2)}
  @media (max-width:900px){.st-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:560px){.st-grid{grid-template-columns:1fr}}
  .st-card{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 10px;align-items:center;background:var(--card);border:1px solid var(--card-line);border-radius:var(--r2);padding:10px;line-height:1.4;font-size:13px}
  .st-face{width:56px;height:56px;border-radius:var(--r1);background:radial-gradient(circle at 50% 35%,#34457a,#141b33);overflow:hidden;border:1px solid var(--card-line)}
  .st-main{min-width:0;display:grid;gap:3px}
  .st-head{display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}.st-head b{font-weight:400;font-size:15px;overflow:hidden;text-overflow:ellipsis}.st-head small{color:var(--gold);font-size:12px}
  .st-main .xp{margin:0}
  .st-next{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}.st-next span{color:var(--gold)}
  .st-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 6px;margin:0;font-variant-numeric:tabular-nums}
  .st-stats div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 8px;border-radius:4px;background:rgba(0,0,0,.22);white-space:nowrap;min-width:0}
  .st-stats dt{color:var(--muted);font-size:12px}.st-stats dd{margin:0;font-size:13px}
  .st-sk{grid-column:1/-1;font-size:12px;color:var(--gold);line-height:1.45}
  .st-card .st-eq{grid-column:1/-1;margin:0;font-size:12px;line-height:1.45;display:grid;gap:1px}.st-card .st-eq span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st-card .st-eq b{font-weight:400;color:var(--ink)}
  .st-head .tt{flex:none}
  .st-eq{font-size:13px;color:var(--muted);margin-top:10px}
  .st-foot{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:10px 0 0}.st-foot b{color:var(--ink);font-weight:400}
  .fr{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}.fr-art{background:#1c2744;border-radius:8px}
  .cb{display:grid;grid-template-columns:minmax(150px,30%) 1fr;gap:18px}
  .cb-face{background:radial-gradient(circle at 50% 40%,#2c3a64,#141b33);border-radius:8px;align-self:start}
  .cb-role{color:var(--gold);font-size:13px}.cb h3{color:var(--ink);font-size:24px}.cb h3 small{font-size:13px;color:var(--muted)}
  .cb dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-size:14px}.cb dt{color:var(--muted)}.cb dd{margin:0}
  .cb-line{font-size:15px;border-top:1px dashed rgba(244,240,230,.3);padding-top:8px;color:#ffe9b8}
  .howto{padding-left:1.2em;margin:0;display:grid;gap:4px}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;padding:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
  .hud-tl{position:absolute;left:calc(14px + var(--sl));top:calc(10px + var(--st));display:grid;gap:5px;justify-items:start;max-width:45vw}
  /* 目的チップ：1行目＝やること（太字・最大2行）、2行目＝章・推奨Lvなど（小・金） */
  #obj{position:relative;max-width:45vw;font-family:var(--pixel);font-size:13px;line-height:1.35;background:var(--chip);border:1px solid var(--line);border-radius:var(--r1);padding:4px 10px 4px 22px;pointer-events:auto;cursor:pointer;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;transition:border-color .4s}
  #obj:has(.obj-main){display:grid;gap:1px}
  #obj::before{content:'▶';position:absolute;left:8px;top:5px;font-size:10px;line-height:1.7;color:var(--gold)}
  #obj .obj-main{font-family:var(--ui);font-weight:700;font-size:13px;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:auto-phrase}
  #obj .obj-meta{font-size:11px;line-height:1.3;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #obj.fresh{animation:objIn .6s ease-out;border-color:var(--gold)}
  @keyframes objIn{from{transform:translateX(-12px);opacity:0}}
  /* パーティ（丸い顔アイコン） */
  #pmini{display:flex;gap:5px}
  .pm2{position:relative;width:40px;display:grid;gap:2px;justify-items:center}
  .pm2 .f{width:40px;height:40px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#34457a,#141b33);border:2px solid rgba(244,240,230,.7);box-shadow:0 2px 6px rgba(0,0,0,.5)}
  .pm2 .f svg{width:100%;height:100%;display:block;transform:scale(1.35) translateY(8%)}
  .pm2 .hb{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.55);overflow:hidden}.pm2 .hb i{display:block;height:100%;background:var(--hp)}
  .pm2 .lv{position:absolute;right:-3px;top:-3px;font:10px var(--pixel);background:rgba(12,18,40,.9);border:1px solid var(--line);border-radius:6px;padding:0 3px}
  .pm2.low .f{border-color:var(--danger);animation:lowhp 1s ease-in-out infinite}.pm2.low .hb i{background:var(--danger)}.pm2.ko .f{filter:grayscale(1) brightness(.6)}
  @keyframes lowhp{50%{box-shadow:0 0 12px var(--danger)}}
  .bar{display:block;height:6px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
  .bar i{display:block;height:100%;background:var(--hp);transition:width .3s}
  .bar.mp i{background:var(--mp)}
  .hud-tr{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;pointer-events:auto}
  #inv{display:flex;gap:10px;font-family:var(--pixel);font-size:13px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;pointer-events:none}
  #inv b{color:var(--gold);font-weight:400}
  #inv .mat{display:none}body.building #inv .mat{display:inline}
  .chip-btn{pointer-events:auto;font:700 13px var(--ui);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;}
  #btnMenu,#btnMute{min-height:44px;display:inline-flex;align-items:center;gap:4px;touch-action:manipulation}#btnMenu{padding:0 16px;font-size:14px}#btnMute{padding:0 14px}
  #btnMute{position:fixed;right:calc(14px + var(--sr));bottom:calc(12px + var(--sb));z-index:60;pointer-events:auto;font-size:12px;opacity:.8}
  body.infield #btnMute{bottom:auto;top:calc(66px + clamp(92px,24vh,132px) + var(--st))} /* ミニマップ（ux.js #mmap）の 下 */
  body.modal #btnMute{display:none}
  #guide{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 6px;font-family:var(--pixel);font-size:13px}
  #arrow{width:22px;height:22px;display:grid;place-items:center}
  #toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(16px,2.6vw,24px);letter-spacing:.1em;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.7);opacity:0;transition:opacity .6s;pointer-events:none;z-index:30;max-width:80vw;line-height:1.6}
  #toast.on{opacity:1}
  #tlabel{position:fixed;left:0;top:0;font-family:var(--pixel);font-size:13px;background:rgba(12,18,40,.82);border:1px solid rgba(244,240,230,.6);border-radius:6px;padding:3px 9px;white-space:nowrap;pointer-events:none;z-index:20}
  .float{position:fixed;transform:translate(-50%,-50%);font-family:var(--pixel);font-size:16px;color:var(--gold);text-shadow:0 1px 4px #000;pointer-events:none;animation:rise 1.4s ease-out forwards;z-index:25}
  @keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
  .btns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end;justify-items:end;pointer-events:none}
  .rb{pointer-events:auto;border-radius:50%;background:var(--chip);border:1.5px solid var(--line);cursor:pointer;display:grid;place-items:center;font:700 13px var(--ui);touch-action:none;white-space:nowrap}
  /* しらべる：ラベルは 空白で 2行に 折り、長さに 合わせて 文字を 縮める（--fit は ux.js が 設定） */
  #btnAct{width:86px;height:86px;grid-row:1/3;grid-column:2;padding:8px;text-align:center;overflow:hidden}
  #btnActLabel{display:block;max-width:100%;font-size:calc(13px * var(--fit,1));line-height:1.18;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.02em}
  #btnAct.ready{background:linear-gradient(180deg,var(--flame),var(--flame-deep));color:#2a1406;border:0;box-shadow:0 0 22px rgba(243,165,74,.5)}
  #btnBuild{font-size:12px}
  @media (max-height:430px){#btnAct{width:74px;height:74px;padding:6px}}
  #btnJump{width:60px;height:60px}
  .buildbar{position:absolute;right:calc(186px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;pointer-events:none}
  .buildbar .rb{width:52px;height:52px}
  #btnPlace,#btnBreak,#btnMat{display:none}
  body.building #btnPlace,body.building #btnBreak,body.building #btnMat{display:grid}
  body.building #btnBuild{background:var(--gold);color:#241a08}
  .keys-hint{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--muted);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 10px;line-height:1.7}
  @media (pointer:coarse){.keys-hint{display:none}}
  @media (pointer:fine){#btnJump{display:none}.buildbar{right:calc(124px + env(safe-area-inset-right,0px))}}
  .stick{position:fixed;width:112px;height:112px;border-radius:50%;border:1.5px solid var(--line);background:rgba(18,22,28,.28);transform:translate(-50%,-50%);pointer-events:none;z-index:15}
  .stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:rgba(243,239,228,.55);transform:translate(-50%,-50%)}

  /* ---------- dialogue ---------- */

  /* ---------- v4 ---------- */

  #tip{position:fixed;left:50%;top:calc(58px + var(--st));transform:translate(-50%,-10px);width:max-content;max-width:max(260px,min(540px,calc(var(--app-w,100vw) - 400px - var(--sl) - var(--sr))));background:var(--panel-bg);border:2px solid var(--gold);border-radius:var(--r2);box-shadow:0 8px 24px rgba(0,0,0,.45);padding:8px 14px;font-family:var(--pixel);font-size:13px;line-height:1.55;display:grid;gap:2px;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;z-index:36}

  .res-row{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}.res-row.down{opacity:.55}.res-face{width:52px;height:52px;border-radius:6px;background:#1c2744;overflow:hidden}.res-face svg{width:100%;height:100%}

  /* 地図：地図が 主役（使える 高さいっぱいの 正方形）。ワープは 地図上の ピンを タップ */
  .mapp{--map:min(calc(var(--app-h,100vh) - 48px - var(--st) - var(--sb)),calc(var(--app-w,100vw) - 290px - var(--sl) - var(--sr)));width:auto;max-width:calc(var(--app-w,100vw) - 24px - var(--sl) - var(--sr));max-height:calc(var(--app-h,100vh) - 16px - var(--st) - var(--sb));padding:var(--s3);overflow:hidden}
