name: Downloadable Git backup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: |
          npm run backup
          mkdir -p "$RUNNER_TEMP/kazetomo-backup"
          cp ../backups/*/* "$RUNNER_TEMP/kazetomo-backup/"
      - uses: actions/upload-artifact@v7
        with:
          name: kazetomo-git-backup
          path: ${{ runner.temp }}/kazetomo-backup/
          if-no-files-found: error
          retention-days: 30
